[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "systematic-trading-framework"
version = "0.1.0"
description = "Systematic CFD trading framework based on Robert Carver's methodology"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ctrader-open-api>=0.9.2",
    "python-dotenv>=1.0",
    "pysystemtrade @ git+https://github.com/robcarver17/pysystemtrade.git",
    "service-identity>=24.2.0",
    "yfinance>=1.6.0",
    "nasdaq-data-link>=1.0.4",
    "pandas-datareader>=0.10.0",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
# Local web UI (Streamlit) for driving the calibration pipeline.
ui = ["streamlit>=1.36", "plotly>=5.22"]

# Local development / testing.
dev = ["pytest>=8"]

[project.scripts]
trading-ui = "src.webui.launch:main"

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
no-build-isolation-package = ["statsmodels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
