# BUILD v7 — 15 instruments: v6 minus Gasoline
# Gasoline removed to extend common_start from 2000-11 → 1992-01,
# giving IS up to ~2011 and a longer OOS window (~15 years).
# Weights are equal placeholders (1/15 ≈ 0.0667). Step 4 calibration overwrites them.
# traded: true  → Pepperstone/cTrader live universe

instruments:

