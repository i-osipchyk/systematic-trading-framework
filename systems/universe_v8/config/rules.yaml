rules:
  # ── Trend: EWMAC 5 speeds ─────────────────────────────────────────────────
  # EWMAC_2_8 excluded: cost ceiling 0.0024 (too tight for most spreads).

  ewmac:
    pairs:
      - [4, 16]     # ~1-4 weeks
      - [8, 32]     # ~4-8 weeks
      - [16, 64]    # ~2-4 months
      - [32, 128]   # ~4-6 months
      - [64, 256]   # ~6-12 months

  # ── Breakout ──────────────────────────────────────────────────────────────
  # Note: Breakout corr 0.85-0.90 with EWMAC (structurally redundant above 0.80
  # threshold). Included by design — contributes a distinct signal mechanism even
  # at high correlation; weight budget will absorb the overlap.

  breakout:
    lookbacks:
      - 20

  # ── Seasonality ──────────────────────────────────────────────────────────
  # Applied to all 11 instruments.
  seasonality:
    instruments: [XAU, XAG, COPPER,
                  SpotCrude,
                  Coffee, Cocoa, Sugar, Corn, Cotton, Soybeans, Wheat]
