# BUILD v8 — 11 instruments: commodities only (no Gasoline)
# Gasoline excluded: IS history starts 2000-11, limits common_start.
# NatGas excluded: shale revolution broke trend structure (structural).
# Weights are equal placeholders (1/11 ≈ 0.0909). Step 4 calibration overwrites them.
# traded: true  → Pepperstone/cTrader live universe

instruments:

  # ── Metals ──────────────────────────────────────────────────────────────────

  XAU:
    description: Gold / US Dollar
    asset_type: commodity
    currency: USD
    weight: 0.0909
    pointsize: 100.0
    spread_cost: 0.35
    lot_step: 0.01
    traded: true
    ctrader_symbol: XAUUSD
    quandl_dataset: CHRIS/CME_GC1
    yf_ticker: "GC=F"
    datahub_gold: true     # datahub.io monthly LBMA fix from 1833 → splice with GC=F

  XAG:
    description: Silver / US Dollar
    asset_type: commodity
    currency: USD
    weight: 0.0909
    pointsize: 5000.0
    spread_cost: 0.02
    lot_step: 0.01
    traded: true
    ctrader_symbol: XAGUSD
    quandl_dataset: CHRIS/CME_SI1
    yf_ticker: "SI=F"
    eco3min_silver: true   # eco3min.fr silver-price.csv, World Bank monthly from 1960

  COPPER:
    description: Copper Futures (continuous)
    asset_type: commodity
    currency: USD
    weight: 0.0909
    pointsize: 25000.0
    spread_cost: 0.0005
    lot_step: 0.01
    traded: true
    ctrader_symbol: Copper
    quandl_dataset: CHRIS/CME_HG1
    yf_ticker: "HG=F"
    fred_price: COPPER     # FRED PCOPPUSDM monthly LME copper, from 1992

  # ── Energy ──────────────────────────────────────────────────────────────────
  # Gasoline excluded: starts 2000-11, limiting common_start and IS window.
  # NatGas excluded: shale revolution permanently broke trend structure (structural).

  SpotCrude:
    description: WTI Crude Oil
    asset_type: commodity
    currency: USD
    weight: 0.0909
    pointsize: 1000.0
    spread_cost: 0.04
    lot_step: 0.01
    traded: true
    ctrader_symbol: SpotCrude
    quandl_dataset: CHRIS/CME_CL1
    yf_ticker: "CL=F"
    fred_price: SpotCrude  # FRED DCOILWTICO spot price, from 1986

