rules:
  # ── Trend: EWMAC 5 speeds ─────────────────────────────────────────────────
  # Breakout (corr 0.88-0.90 with matched EWMAC) and TSMOM (0.84-0.85) dropped
  # after Step 3b: both above the 0.80 structural redundancy threshold.
  # EWMAC_2_8 dropped: corr 0.87 with EWMAC_4_16; cost ceiling 0.0027 (too tight).

  ewmac:
    pairs:
      - [4, 16]     # ~2-4 weeks
      - [8, 32]     # ~4-8 weeks
      - [16, 64]    # ~2-4 months
      - [32, 128]   # ~4-6 months
      - [64, 256]   # ~6-12 months

  # ── Seasonality ──────────────────────────────────────────────────────────
  # Applied to all 23 instruments. IS monthly scalars determine where signal
  # exists; near-zero scalars for instruments with no seasonal pattern have
  # negligible impact after FDM adjustment.
  seasonality:
    instruments: [US500, NAS100, GER40, JPN225, HK50, UK100,
                  US2YR, US5YR, US10YR, US30YR, BUND,
                  XAU, XAG, COPPER,
                  SpotCrude, Gasoline,
                  Coffee, Cocoa, Sugar, Corn, Cotton, Soybeans, Wheat]
