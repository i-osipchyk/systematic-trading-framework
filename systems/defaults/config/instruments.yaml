# DEFAULT instrument universe — all instruments with sufficient IS data (≥10 years pre-2010).
# Excluded for insufficient history: BTC, ETH, US30, USOIL (all start ~2017).
# NatGas included as candidate despite structural trend issues (shale era post-2008);
# Step 1 structural analysis will determine inclusion.
# FX pointsize = 100,000 (1 standard lot in base currency); verify against broker spec.
# Weights are equal placeholders (1/31). Step 4 calibration overwrites them.
# traded: true  → live universe candidate
# traded: false → backtest-only candidate (diversification value only)
# ─────────────────────────────────────────────────────────────────────────────

