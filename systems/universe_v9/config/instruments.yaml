# BUILD v9 — 17 instruments: v7 + XAG (Silver) + Gasoline
# IS: 2001–2018 (~17.5 years, 70%), OOS: 2018–2026 (~8.5 years, 30%), computed via test_size.
# Gasoline re-included: data from 2001-01 usable (pre-2001 data universally corrupt, not instrument-specific).
# XAG added: silver supply/demand driver, sub-grouped with XAU in Step 4 handcrafting.
# Cocoa excluded: IS SR −0.31 across all rule families (structural, not performance-based pruning).
# Weights are equal placeholders (1/17 ≈ 0.0588). Step 4 calibration overwrites them.
# traded: true  → Pepperstone/cTrader live universe

instruments:

  # ── Equity Indices ──────────────────────────────────────────────────────────

  US500:
    description: S&P 500 Index
    asset_type: index
    currency: USD
    weight: 0.0588
