# BUILD v5 — 17 instruments: ags-heavy, commodities (no silver), one US bond, Bund, 4 equity indices
# ─────────────────────────────────────────────────────────────────────────────
# Weights are equal placeholders (1/17 ≈ 0.0588). Step 4 calibration overwrites them.
# traded: true  → Pepperstone/cTrader live universe
# ─────────────────────────────────────────────────────────────────────────────

instruments:

  # ── Equity Indices ──────────────────────────────────────────────────────────

  US500:
    description: S&P 500 Index
    asset_type: index
    currency: USD
    weight: 0.0588
    pointsize: 1.0
    spread_cost: 0.4
    lot_step: 0.1
    traded: true
    ctrader_symbol: US500
    yf_ticker: "^GSPC"

  GER40:
    description: DAX 40 Index
    asset_type: index
    currency: EUR
    weight: 0.0588
    pointsize: 1.0
    spread_cost: 1.5
    lot_step: 0.1
    traded: true
    ctrader_symbol: GER40
    yf_ticker: "^GDAXI"

  JPN225:
    description: Nikkei 225 Index
    asset_type: index
    currency: JPY
    weight: 0.0588
    pointsize: 1.0
    spread_cost: 10.0
    lot_step: 1.0
    traded: true
    ctrader_symbol: JPN225
    yf_ticker: "^N225"

  HK50:
    description: Hang Seng Index
    asset_type: index
    currency: HKD
    weight: 0.0588
    pointsize: 1.0
    spread_cost: 15.0
    lot_step: 1.0
    traded: true
    ctrader_symbol: HK50
    yf_ticker: "^HSI"

  # ── Government Bonds ────────────────────────────────────────────────────────

  US10YR:
    description: US 10-Year T-Note Futures (continuous)
    asset_type: bond
    currency: USD
    weight: 0.0588
    pointsize: 1.0
    spread_cost: 0.02
    lot_step: 0.01
    traded: true
    quandl_dataset: CHRIS/CME_TY1
    yf_ticker: "ZN=F"
    fred_bond: US10YR      # FRED DGS10 yield → price proxy, from 1962

  BUND:
    description: German Bund Futures (continuous)
    asset_type: bond
    currency: EUR
    weight: 0.0588
    pointsize: 1.0
    spread_cost: 0.02
    lot_step: 0.01
    traded: true
    ctrader_symbol: EUROBUNDF
    quandl_dataset: CHRIS/EUREX_FGBL1
    fred_bond: BUND        # FRED German long-term yield → price proxy, from 1960

  # ── Metals ──────────────────────────────────────────────────────────────────
  # XAG excluded by design.

  XAU:
    description: Gold / US Dollar
    asset_type: commodity
    currency: USD
    weight: 0.0588
    pointsize: 100.0
    spread_cost: 0.35
    lot_step: 0.01
    traded: true
    ctrader_symbol: XAUUSD
    quandl_dataset: CHRIS/CME_GC1
    yf_ticker: "GC=F"
    datahub_gold: true     # datahub.io monthly LBMA fix from 1833 → splice with GC=F

  COPPER:
    description: Copper Futures (continuous)
    asset_type: commodity
    currency: USD
    weight: 0.0588
    pointsize: 25000.0
    spread_cost: 0.0005
    lot_step: 0.01
    traded: true
    ctrader_symbol: Copper
    quandl_dataset: CHRIS/CME_HG1
    yf_ticker: "HG=F"
    fred_price: COPPER     # FRED PCOPPUSDM monthly LME copper, from 1992

  # ── Energy ──────────────────────────────────────────────────────────────────
  # NatGas excluded: shale revolution permanently broke trend structure (structural).

  SpotCrude:
    description: WTI Crude Oil
    asset_type: commodity
    currency: USD
    weight: 0.0588
    pointsize: 1000.0
    spread_cost: 0.04
    lot_step: 0.01
    traded: true
    ctrader_symbol: SpotCrude
    quandl_dataset: CHRIS/CME_CL1
    yf_ticker: "CL=F"
    fred_price: SpotCrude  # FRED DCOILWTICO spot price, from 1986

  Gasoline:
    description: RBOB Gasoline Futures (continuous)
    asset_type: commodity
    currency: USD
    weight: 0.0588
    pointsize: 42000.0
    spread_cost: 0.001
    lot_step: 0.01
    traded: true
    quandl_dataset: CHRIS/CME_RB1
    yf_ticker: "RB=F"
    # IS history starts 2000-11 (10yr); shorter than most

