# BUILD v3 — 23 instruments: equities, bonds, commodities (no FX)
# ─────────────────────────────────────────────────────────────────────────────
# Instrument selection: docs/decisions/build_v3_step1_instrument_selection.md
# Rule selection:       docs/decisions/step2_rule_selection.md (unchanged from v2)
#
# IS window: ~1984–2010 (instrument-dependent start; all IS data pre-2010-01-01)
# Val window: 2010-01-01 – 2018-01-01  (locked, not used for any calibration)
# Test window: 2018-01-01 – present     (locked, one-shot only)
#
# Weights are equal placeholders (1/23). Step 4 calibration overwrites them.
# traded: true  → Pepperstone/cTrader live universe
# traded: false → backtest universe only (no live position; diversification only)
# ─────────────────────────────────────────────────────────────────────────────

