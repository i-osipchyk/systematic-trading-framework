# TARGET UNIVERSE — 29 instruments, 40-year IS backtest
# ─────────────────────────────────────────────────────────────────────────────
# Instrument selection: docs/decisions/step1_instrument_selection.md
# Rule selection:       docs/decisions/step2_rule_selection.md
#
# IS window: ~1984–2010 (instrument-dependent start; all IS data pre-2010-01-01)
# Val window: 2010-01-01 – 2018-01-01  (locked, not used for any calibration)
# Test window: 2018-01-01 – present     (locked, one-shot only)
#
# Weights here are equal placeholders (1/29). Step 4 calibration overwrites them.
# traded: true  → Pepperstone/cTrader live universe
# traded: false → backtest universe only (no live position; diversification only)
# ─────────────────────────────────────────────────────────────────────────────

timeframe: D1
bars_per_year: 256
end_date: "2010-01-01"
split_date: "2010-01-01"   # standalone calibration scripts treat all data as IS

