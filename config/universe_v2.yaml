rules:
  # ── Trend family: EWMAC only ─────────────────────────────────────────────────
  # Breakout and TSMOM tested in Step 3b; dropped — corr 0.85-0.90 with EWMAC
  # at matched timescales. Timescale spread within EWMAC provides all within-trend
  # diversification (EWMAC_2_8 ↔ EWMAC_64_256 corr = 0.10).

  ewmac:
    pairs:
      - [4, 16]     # ~2-4 weeks  (fastest; 2_8 dropped — corr 0.87 with 4_16, fails 11/27 on cost)
      - [8, 32]     # ~4-8 weeks
      - [16, 64]    # ~2-4 months
      - [32, 128]   # ~4-6 months
      - [64, 256]   # ~6-12 months

  # ── Carry ───────────────────────────────────────────────────────────────────
  # Applied to FX (5) and Bonds (5) only.
  # Equities and Metals excluded (weak/unmeasurable carry signal for CFDs).
  # Energy and Ags excluded (calendar spread data not available for all instruments).
  carry:
    instruments: [EURUSD, GBPUSD, AUDUSD, USDJPY, USDCAD,
                  US2YR, US5YR, US10YR, US30YR, BUND]

  # ── Seasonality ─────────────────────────────────────────────────────────────
  # Applied to Ags (7) and Energy (2) only.
  seasonality:
    instruments: [Coffee, Cocoa, Sugar, Corn, Soybeans, Wheat, Cotton,
                  SpotCrude, Gasoline]
