    weight: 0.04
    pointsize: 100000.0
    spread_cost: 0.020
    lot_step: 0.01
    traded: true
    ctrader_symbol: USDJPY
    yf_ticker: "USDJPY=X"
    fred_fx: USDJPY        # FRED DEXJPUS, daily from 1971

  USDCAD:
