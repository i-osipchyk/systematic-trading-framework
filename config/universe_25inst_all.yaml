    currency: CAD
    weight: 0.04
    pointsize: 100000.0
    spread_cost: 0.00012
    lot_step: 0.01
    traded: true
    ctrader_symbol: USDCAD
    yf_ticker: "USDCAD=X"
    fred_fx: USDCAD        # FRED DEXCAUS, daily from 1971

  # ── Equity Indices ─────────────────────────────────────────────────────────

  US500:
