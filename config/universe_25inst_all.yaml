# TARGET UNIVERSE — 25 instruments, 40-year backtest
# ─────────────────────────────────────────────────────────────────────────────
# Data sources (preferred → fallback):
#   quandl_dataset : Nasdaq Data Link CHRIS continuous futures (Panama-adjusted)
#   yf_ticker      : Yahoo Finance ticker (front-month or cash index)
#   ctrader_symbol : Pepperstone/cTrader symbol for recent data (optional)
#
# Instrument selection decisions: docs/decisions/step1_instrument_selection.md
# Rule selection decisions:       docs/decisions/step2_rule_selection.md
#
# For live trading:  instruments without ctrader_symbol are NOT traded on
#                    Pepperstone (they exist for diversification in backtest).
#                    All are traded: true for backtest calibration purposes.
#
# Instrument weights are set equally here (1/25); overwritten by calibration.
# ─────────────────────────────────────────────────────────────────────────────

timeframe: D1
bars_per_year: 256
end_date: "2010-01-01"
split_date: "2010-01-01"   # standalone calibration scripts treat all data as IS

instruments:

  # ── FX ────────────────────────────────────────────────────────────────────

  EURUSD:
    description: Euro / US Dollar
    asset_type: currency
    currency: USD
    weight: 0.04
    pointsize: 100000.0
    spread_cost: 0.00007
    lot_step: 0.01
    traded: true
    ctrader_symbol: EURUSD
    yf_ticker: "EURUSD=X"
    fred_fx: EURUSD        # DEXUSEU from 1999; DEM proxy (DEXGEUS/1.95583) pre-1999

  GBPUSD:
    description: British Pound / US Dollar
    asset_type: currency
    currency: USD
    weight: 0.04
    pointsize: 100000.0
    spread_cost: 0.00009
    lot_step: 0.01
    traded: true
    ctrader_symbol: GBPUSD
    yf_ticker: "GBPUSD=X"
    fred_fx: GBPUSD        # FRED DEXUSUK, USD per GBP, daily from 1971

  AUDUSD:
    description: Australian Dollar / US Dollar
    asset_type: currency
    currency: USD
    weight: 0.04
    pointsize: 100000.0
    spread_cost: 0.00009
    lot_step: 0.01
    traded: true
    ctrader_symbol: AUDUSD
    yf_ticker: "AUDUSD=X"
    fred_fx: AUDUSD        # FRED DEXUSAL, daily from 1971

