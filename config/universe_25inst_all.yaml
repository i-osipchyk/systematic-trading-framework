    asset_type: bond
    currency: USD
    weight: 0.04
    pointsize: 1000.0
    spread_cost: 0.01
    lot_step: 0.01
    traded: true
    quandl_dataset: CHRIS/CME_TU1
    yf_ticker: "ZT=F"
    fred_bond: US2YR       # FRED DGS2 yield → price proxy, from 1976

  US5YR:
