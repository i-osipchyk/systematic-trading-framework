# ─────────────────────────────────────────────────────────────────────────────
# Trading rules
# ─────────────────────────────────────────────────────────────────────────────
rules:
  ewmac:
    family: ema_crossover
    pairs:
      - [2, 8]
      - [4, 16]
      - [8, 32]
      - [16, 64]
      - [32, 128]
      - [64, 256]

  mr:
    family: mean_reversion
    spans:
      - 16
      - 200
