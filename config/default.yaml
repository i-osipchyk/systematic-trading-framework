# Default strategy configuration
# ─────────────────────────────────────────────────────────────────────────────
# Contains both the instrument universe and the trading rule set.
# Copy and rename this file to create alternative configurations, then run:
#   uv run python calibrate/pipeline.py --config config/your_name.yaml
#
# Timeframe fields:
#   timeframe     : bar period for data fetch and calibration — D1 | H4 | H1 | M1
#   bars_per_year : annualisation factor (bars in a trading year).
#                   Omit to use the built-in defaults:
#                     D1 → 256, H4 → 1536, H1 → 6144, M1 → 368640
#
timeframe: D1
bars_per_year: 256

# Instrument fields:
#   ctrader_symbol : symbol on the broker platform
#   description    : human-readable name
#   asset_type     : crypto | index | commodity | currency
#   currency       : native P&L currency (USD | EUR | GBP | JPY)
#   traded         : true = in portfolio; false = FX conversion helper only
#   pointsize      : cash P&L per 1-unit price move per 1 contract
#   spread_cost    : effective round-trip cost in native price units
#   lot_step       : minimum tradeable lot increment on the broker (e.g. 0.01)
#                    rounded_position = round(position / lot_step) * lot_step
#   weight         : calibrated instrument weight (output of step 06)
#
# FX conversion helpers are auto-detected from the currencies of traded
# instruments. You only need to declare them here if they exist in the
# data store — their traded: false flag keeps them out of the portfolio.

instruments:
  BTC:
    ctrader_symbol: BTCUSD
    description: Bitcoin / USD
    asset_type: crypto
    currency: USD
    traded: true
    weight: 0.125
    pointsize: 1.0
    spread_cost: 35.0
    lot_step: 0.01

  ETH:
