# TEST CONFIG — 2018-2026 (blind test period)
# ─────────────────────────────────────────────────────────────────────────────
# 13 instruments at equal weight 1/13 ≈ 7.69%.
# 8 frozen dev instruments + NAS100, JPN225, UK100, GER40, SpotCrude.
# split_date pins the IS/OOS boundary at 2018-01-01.
#
# Workflow:
#   1. Run calibrate/01 → 07 with this config → calibrates on IS 2011-2018
#   2. Run calibrate/08 → reports IS (2011-2018) + OOS (2018-2026)
# ─────────────────────────────────────────────────────────────────────────────

