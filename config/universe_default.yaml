# CANDIDATE UNIVERSE — 31 instruments with valid IS and OOS data
# ─────────────────────────────────────────────────────────────────────────────
# Step 1 output: review this file, remove instruments that fail structural
# criteria (regime change, data quality, cost infeasibility, cross-asset
# redundancy), then confirm the remaining list as the build universe.
#
# Data source: D1 adjusted prices in data/futures/D1/adjusted_prices_csv/
#
# Excluded — no IS data (all start 2017 or later):
#   BTC, ETH, US30, USOIL
#
# Weights are equal placeholders (1/31). Step 4 calibration overwrites them.
# traded: true  → Pepperstone/cTrader live universe
# traded: false → backtest-only (diversification; no live position)
# ─────────────────────────────────────────────────────────────────────────────

