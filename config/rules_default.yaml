rules:
  # ── Trend: EWMAC ─────────────────────────────────────────────────────────
  # pairs: [fast_span, slow_span]; slow = 4× fast is the standard ratio.
  ewmac:
    pairs:
      - [4, 16]     # ~2-4 weeks
      - [8, 32]     # ~4-8 weeks
      - [16, 64]    # ~2-4 months
      - [32, 128]   # ~4-6 months
      - [64, 256]   # ~6-12 months

  # ── Trend: Time-Series Momentum ──────────────────────────────────────────
  # lookbacks in bars (D1: 63≈3mo, 126≈6mo, 252≈12mo).
  tsmom:
    lookbacks: [63, 126, 252]

  # ── Trend: Breakout (Donchian channel) ───────────────────────────────────
  # lookbacks in bars.
  breakout:
    lookbacks: [20, 50, 100, 200]

  # ── Mean Reversion ───────────────────────────────────────────────────────
  # spans: EMA span in bars (16≈short-term, 200≈long-term).
  mr:
    spans: [16, 200]

  # ── Carry ─────────────────────────────────────────────────────────────────
  # No variants — one carry signal per instrument.
  # List only the instruments where carry is well-defined and measurable.
  carry:
    instruments: []

  # ── Seasonality ───────────────────────────────────────────────────────────
  # Applied per-instrument; scalars calibrated from IS monthly return means.
  # Near-zero scalars for non-seasonal instruments have negligible impact.
  seasonality:
    instruments: []
