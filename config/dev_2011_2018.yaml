# ─────────────────────────────────────────────────────────────────────────────
# Trading rules
# ─────────────────────────────────────────────────────────────────────────────
# EWMAC_2_8 excluded (high turnover, poor cost-adjusted edge on CFD spreads).
# MR kept for dev evaluation — will be pruned if it doesn't earn its weight.

rules:
  ewmac:
    family: ema_crossover
    pairs:
      - [4, 16]
      - [8, 32]
      - [16, 64]
      - [32, 128]
      - [64, 256]

  breakout:
    family: donchian_breakout
    lookbacks:
      - 20
      - 50
      - 100
      - 200

  tsmom:
    family: time_series_momentum
    lookbacks:
      - 63
      - 126
      - 252

  mr:
    family: mean_reversion
    spans:
      - 16
      - 200
