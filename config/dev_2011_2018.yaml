# Dev-period configuration: 2011–2018
# ─────────────────────────────────────────────────────────────────────────────
# Used for walk-forward calibration and rule selection.
# All iteration (rule variants, universe, weights) happens on this period only.
#
# The end_date caps the data window so no 2018+ bars are seen during dev WF.
# Do NOT look at results beyond this date until the dev system is frozen and
# config/test_2018_2026.yaml is the active file.
#
# Instruments: 9 dev instruments, no crypto, no US30.
# GER40 and SpotCrude excluded — Pepperstone history only goes back to 2014,
# which is insufficient for a 3-year IS window within the 2011-2018 dev period.
# They will be included in the test config (2018-2026) where history is full.
#
# Weights: placeholders — step 06 calibrates these during WF.
# spread_cost: indicative Pepperstone raw-account spreads in price units.

timeframe: D1
bars_per_year: 256
end_date: 2018-01-01

instruments:
  # ── FX ──────────────────────────────────────────────────────────────────────
  EURUSD:
    ctrader_symbol: EURUSD
    description: Euro / US Dollar
    asset_type: currency
    currency: USD
    traded: true
    weight: 0.1111
    pointsize: 100000.0
    spread_cost: 0.00007
    lot_step: 0.01

  GBPUSD:
